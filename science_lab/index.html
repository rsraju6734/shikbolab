<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShikboLab - নিজে করে বিজ্ঞান শেখো</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site">
  <a class="brand" href="index.html">Shikbo<span>Lab</span></a>
  <span>বাংলায় ইন্টারঅ্যাকটিভ বিজ্ঞান ল্যাব</span>
</header>
<div class="wrap">
  <div class="hero">
    <h1>বই পড়ে নয়, <em>নিজে করে</em> বিজ্ঞান শেখো</h1>
    <p>নবম-দশম শ্রেণির জন্য সহজ নোট, অ্যানিমেটেড ল্যাব আর কুইজ। রসায়ন, পদার্থবিজ্ঞান, গণিত ও জীববিজ্ঞান, সব এক জায়গায়।</p>
  </div>
  <div id="app"></div>
</div>
<footer class="site">&copy; ShikboLab &mdash; তৈরির কাজ চলছে</footer>
<script src="js/chapters.js"></script>
<style>
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin:18px 0}
.sbtn{display:block;text-align:center;background:#fff;border:2px solid #e3eaf0;border-top:6px solid #ccc;border-radius:18px;padding:22px 14px;cursor:pointer;font-family:inherit;transition:transform .2s,box-shadow .2s}
.sbtn:hover{transform:translateY(-4px);box-shadow:0 8px 20px rgba(0,0,0,.1)}
.sbtn .ic{font-size:46px;display:block}
.sbtn b{display:block;font-size:22px;margin:6px 0 2px;color:#1f3a5f}
.sbtn small{color:#5b6b78;font-size:14px}
.backbtn{background:#fff;border:2px solid #cfd9e1;border-radius:999px;padding:8px 18px;font-family:inherit;font-size:16px;font-weight:600;cursor:pointer;color:#1f3a5f;margin:6px 0 4px}
.sh{font-size:26px;margin:14px 0 4px;color:#1f3a5f}
.bonus{margin-top:34px;padding:18px;border-radius:18px;background:linear-gradient(135deg,#fff7e0,#eaf7f5);border:2px dashed #e9a23b}
.bonus h2{margin:0 0 4px;color:#1f3a5f}
.bonus>p{margin:0 0 12px;color:#5b6b78}
.empty{background:#f6f9fb;border:2px dashed #cfd9e1;border-radius:14px;padding:18px;text-align:center;color:#5b6b78;margin:12px 0}
</style>
<script src="js/chapters.js"></script>
<script>
var SUBJECTS = {
  chemistry:{name:'রসায়ন',color:'#2a9d8f',icon:'🧪'},
  physics:{name:'পদার্থবিজ্ঞান',color:'#1f3a5f',icon:'⚛️'},
  math:{name:'গণিত',color:'#e76f51',icon:'📐'},
  biology:{name:'জীববিজ্ঞান',color:'#e9a23b',icon:'🧬'}
};
var BD='০১২৩৪৫৬৭৮৯';
function bn(n){return String(n).replace(/\d/g,function(d){return BD[d];});}
function card(c){
  var s=SUBJECTS[c.subject], live=c.status==='live'&&c.file;
  var el=document.createElement(live?'a':'div');
  el.className='card'+(live?'':' disabled');
  el.style.borderTopColor=s.color;
  if(live) el.href=c.file;
  el.innerHTML='<div class="sub" style="color:'+s.color+'">'+s.icon+' '+s.name+'</div><h3>'+c.title+'</h3><p>'+c.desc+'</p><span class="chip '+(live?'live':'soon')+'">'+(live?'ল্যাব খোলো':'শীঘ্রই আসছে')+'</span>';
  return el;
}
function grid(list){var g=document.createElement('div');g.className='grid';list.forEach(function(c){g.appendChild(card(c));});return g;}
function bonusBox(list){
  if(!list.length) return null;
  var d=document.createElement('div');d.className='bonus';
  d.innerHTML='<h2>🎁 বোনাস এক্সট্রা ল্যাব</h2><p>বইয়ের অধ্যায়ের বাইরের মজার ল্যাব। নিজে নিজে পরীক্ষা করে দেখো।</p>';
  d.appendChild(grid(list));return d;
}
function render(){
  var app=document.getElementById('app'); app.innerHTML='';
  var cur=(location.hash||'').replace('#','');
  var all=window.CHAPTERS;
  if(SUBJECTS[cur]){
    var s=SUBJECTS[cur];
    var b=document.createElement('button');b.className='backbtn';b.textContent='← সব বিষয়';
    b.onclick=function(){location.hash='';};app.appendChild(b);
    var h=document.createElement('h2');h.className='sh';h.style.color=s.color;h.textContent=s.icon+' '+s.name+' — অধ্যায়সমূহ';app.appendChild(h);
    var reg=all.filter(function(c){return c.subject===cur&&!c.extra;});
    if(reg.length) app.appendChild(grid(reg));
    else{var e=document.createElement('div');e.className='empty';e.textContent='এই বিষয়ের বইয়ের অধ্যায়গুলো শীঘ্রই আসছে। এর মধ্যে নিচের বোনাস ল্যাব চেষ্টা করো!';app.appendChild(e);}
    var bx=bonusBox(all.filter(function(c){return c.subject===cur&&c.extra;}));
    if(bx) app.appendChild(bx);
  }else{
    var sg=document.createElement('div');sg.className='sgrid';
    for(var k in SUBJECTS){(function(k){
      var s=SUBJECTS[k];
      var n=all.filter(function(c){return c.subject===k&&!c.extra&&c.status==='live';}).length;
      var x=all.filter(function(c){return c.subject===k&&c.extra;}).length;
      var bt=document.createElement('button');bt.className='sbtn';bt.style.borderTopColor=s.color;
      bt.innerHTML='<span class="ic">'+s.icon+'</span><b>'+s.name+'</b><small>'+bn(n)+'টি অধ্যায়'+(x?' + '+bn(x)+'টি বোনাস':'')+'</small>';
      bt.onclick=function(){location.hash=k;};sg.appendChild(bt);
    })(k);}
    app.appendChild(sg);
    var bx2=bonusBox(all.filter(function(c){return c.extra;}));
    if(bx2) app.appendChild(bx2);
  }
}
window.addEventListener('hashchange',function(){render();window.scrollTo(0,0);});
render();
</script>
</body>
</html>
